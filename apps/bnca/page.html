<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrightNet Core Admin</title>
<link rel="stylesheet" href="/face.css" />
<style>
  .stage { flex: 1; min-height: 0; overflow: auto; padding: 12px 28px 40px; }
  .stage h1 { margin: 0; font-size: clamp(56px, 8vw, 88px); line-height: 0.9; letter-spacing: -0.07em; font-weight: 600; }
  .lede { max-width: 36rem; color: var(--muted); font-size: 18px; }
  .eyebrow { margin: 0 0 10px; color: var(--accent); font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
  form, .cards { display: grid; gap: 12px; max-width: 520px; margin-top: 28px; }
  label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
  input { background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 600; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .error { color: var(--danger); margin: 0; }
  article { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--raise) 92%, transparent); }
  article strong { display: block; font-size: 18px; letter-spacing: -0.03em; }
  article p { margin: 4px 0 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .ok { color: var(--ok); }
  .bad { color: var(--danger); }
  #core { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="shell">
  <header class="frame">
    <div class="brand"><i></i>BrightNet</div>
    <p class="product">Core Admin</p>
    <div class="winbtns">
      <button type="button" data-act="min" aria-label="Réduire"></button>
      <button type="button" data-act="max" aria-label="Agrandir"></button>
      <button type="button" data-act="close" aria-label="Fermer"></button>
    </div>
  </header>
  <div class="stage">
    <section id="login">
      <p class="eyebrow">BNCA</p>
      <h1>Le Core.</h1>
      <p class="lede">Cette application gère le Core. Elle ne collecte pas cette machine.</p>
      <form id="enter">
        <label>Adresse du Core <input name="url" value="http://192.168.1.3:1717" required /></label>
        <label>Identifiant <input name="username" autocomplete="username" required /></label>
        <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="error" class="error"></p>
        <button type="submit">Entrer</button>
      </form>
    </section>
    <section id="admin" hidden>
      <p class="eyebrow">BNCA</p>
      <h1>Les Node.</h1>
      <p id="core"></p>
      <div class="cards" id="nodes"></div>
      <p><button class="ghost" id="leave" type="button">Quitter</button></p>
    </section>
  </div>
</div>
<script src="/frame.js"></script>
<script>
const login = document.querySelector("#login")
const admin = document.querySelector("#admin")
const error = document.querySelector("#error")
document.querySelector("#enter").addEventListener("submit", async (event) => {
  event.preventDefault()
  error.textContent = ""
  const form = event.target
  const res = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
    url: form.url.value, username: form.username.value, password: form.password.value
  })})
  if (!res.ok) { error.textContent = "Le Core refuse cet accès."; return }
  form.password.value = ""
  show(true)
})
document.querySelector("#leave").addEventListener("click", async () => {
  await fetch("/api/logout", {method:"POST"})
  show(false)
})
async function show(on) {
  login.hidden = on
  admin.hidden = !on
  if (on) await refresh()
}
async function refresh() {
  const view = await fetch("/api/admin").then((res) => res.ok ? res.json() : null).catch(() => null)
  if (!view) { show(false); return }
  document.querySelector("#core").textContent = "Interface " + view.ui + "   BNCP " + view.bncp + "   " + view.entities + " entités   " + ({live:"Observations réelles", mixed:"Données mixtes", fixture:"Simulation"}[view.data_origin] || view.data_origin)
  const nodes = document.querySelector("#nodes")
  const agents = view.agents || []
  nodes.innerHTML = agents.length ? "" : "<p>Aucun Node relié.</p>"
  for (const agent of agents) {
    const card = document.createElement("article")
    const text = document.createElement("div")
    text.innerHTML = "<strong></strong><p></p>"
    text.querySelector("strong").textContent = agent.hostname || agent.id
    const online = agent.status === "online"
    text.querySelector("p").textContent = (online ? "En ligne" : "Hors ligne") + "   " + (agent.machine_id || "sans machine-id")
    text.querySelector("p").className = online ? "ok" : "bad"
    const button = document.createElement("button")
    button.className = "ghost"
    button.type = "button"
    button.textContent = "Oublier"
    button.addEventListener("click", async () => {
      if (!window.confirm("Oublier ce Node ? S’il tourne encore, il se réinscrit.")) return
      await fetch("/api/agents/" + encodeURIComponent(agent.id), {method:"DELETE"})
      refresh()
    })
    card.append(text, button)
    nodes.append(card)
  }
}
fetch("/api/session").then((res) => res.json()).then((session) => { if (session.ok) show(true) })
setInterval(() => { if (!admin.hidden) refresh() }, 5000)
</script>
</body>
</html>
